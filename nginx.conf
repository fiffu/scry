server {
    listen 80;
    root /usr/share/nginx/html;

    # Browsers refuse module scripts that are not served as JavaScript, and nginx has no .mjs type.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript application/json text/css text/plain;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location /vendor/ {
        add_header Cache-Control "public, max-age=86400";
    }
}
