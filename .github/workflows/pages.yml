# Builds the static site with Docker and publishes it to GitHub Pages.
# One-time setup: Settings > Pages > Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish. Newer runs wait their turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the static site
        run: docker build --target site --output site .

      - name: Check the build output
        run: |
          for f in index.html worker.mjs manifest.json libs.zip \
                   vendor/index.mjs vendor/sqlite3.wasm vendor/pyodide/pyodide.asm.wasm; do
            test -s "site/$f" || { echo "missing site/$f"; exit 1; }
          done
          du -sh site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
