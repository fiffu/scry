<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>scry</title>
<style>
:root{color-scheme:dark;--bg:#1a1e22;--panel:#23282d;--line:#6b7681;--rule:#394046;--fg:#e4e8eb;--mut:#9aa4ad;--acc:#52c3bd;--accbg:#1d3b3a;--warn:#ff8a73;--ob:#b794f0;--obbg:#31234b;--bar:#171b1f;--win:#6fd08a;--loss:#ff8a73;--sup:#6fb2e6;--fgt:#f08a5d;--pl:68%}

html,body{height:100%;margin:0}

header{position:relative;display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}

button,select,input,textarea{font:inherit;color:var(--fg)}
button{background:var(--panel);border:1px solid var(--line);border-radius:5px;min-height:34px;min-width:34px;padding:0 12px;cursor:pointer}

.chip.on{background:var(--accbg);border-color:var(--acc)}

#sugg button.sel{background:var(--accbg)}
.sw{position:relative}
details{margin:2px 0}
summary{cursor:pointer;padding:4px 0;font-weight:600;font-size:13px}
summary small{color:var(--mut);font-weight:400}
.cond{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:8px;margin:6px 0;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.cond select,.cond input{width:100%;min-width:0}
.cond .wide{grid-column:1/-1}
.hist{margin:6px 0 10px}
.hist .hn{font-weight:600;font-size:13px;padding:4px 0 0}

.hist input[type=range]::-webkit-slider-thumb{box-sizing:border-box;pointer-events:auto;-webkit-appearance:none;width:14px;height:14px;margin-top:3px;border-radius:50%;background:var(--acc);border:2px solid var(--panel);cursor:pointer}
.hist input[type=range]::-moz-range-thumb{box-sizing:border-box;pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--acc);border:2px solid var(--panel);cursor:pointer}
.hist input[type=range]::-webkit-slider-runnable-track{background:transparent;height:20px}

.card .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.chip.file{max-width:300px;min-height:22px;padding:0 8px;font:11.5px ui-monospace,Menlo,Consolas,monospace;color:var(--mut)}

.team{min-width:0;padding:0 16px;display:flex;flex-direction:column;gap:3px}
.team:first-child{padding-left:0}
.team+.team{border-left:1px solid var(--rule)}
.th{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin-bottom:2px}
.th .res{font-weight:600}.th .res.won{color:var(--win)}.th .res.lost{color:var(--loss)}

.pl .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font:700 11px ui-monospace,monospace;color:#fff;flex:none}
.race.T{background:#3f7cc0}.race.P{background:#b08d1f}.race.Z{background:#9a46b8}
.err{color:var(--warn)}

.gamebar{position:sticky;top:-14px;z-index:20;background:var(--bg);margin:-14px -18px 14px;padding:10px 18px;border-bottom:1px solid var(--line);display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap}
.gamebar h2{margin:0}
.gamebar .meta{margin-left:auto;display:flex;gap:10px;align-items:center}
.sub{color:var(--mut);margin-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0}
.panel h3{margin:0 0 8px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
#tl{width:100%;overflow:hidden;position:relative}
#tl svg{display:block;user-select:none}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre;box-shadow:0 4px 14px #0004;z-index:5}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:3px 8px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}

.mono{font-family:ui-monospace,Menlo,Consolas,monospace}

.hi td{padding:3px 14px 3px 0;vertical-align:middle}

.chat td{padding:2px 12px 2px 0}

.bo{table-layout:fixed}
.bo th{padding:4px 8px;font-size:13px;color:var(--fg)}

.bo tr.kt td{border-bottom:1px solid var(--rule);padding-bottom:6px}
.bo .sup{display:inline-block;min-width:2.4em;margin-right:6px;color:var(--mut);text-align:right;line-height:inherit}
.pip{transition:opacity .08s}
.tlrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}

.mapcol{flex:0 0 480px;position:sticky;top:72px}
.mapcol canvas{display:block;border:1px solid var(--line);border-radius:6px;margin:0 auto}

.mapcol .meta2 select{min-height:26px;font-size:12px}
.hud{margin-top:10px;display:grid;gap:5px}
.hud .hrow{display:grid;grid-template-columns:minmax(0,86px) 1fr auto;gap:8px;align-items:center;font-size:11.5px}
.hud .hrow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.hud .bar i{display:block;height:100%;width:0}
.hud .num{color:var(--mut);font:11px ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.mark{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--rule)}
.mu{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.mu .side{display:flex;flex-direction:column;gap:4px}

.mu button{flex:1;min-width:0;min-height:30px;padding:0;font:700 13px ui-monospace,Menlo,Consolas,monospace}
.mu button.on{color:#fff;border-color:transparent}
.mu button.P.on{background:#b08d1f}.mu button.T.on{background:#3f7cc0}.mu button.Z.on{background:#9a46b8}
.mu .vs{color:var(--mut);font-size:12px}
.mu button.P{background:color-mix(in srgb,#b08d1f 16%,var(--panel));border-color:color-mix(in srgb,#b08d1f 38%,var(--line))}
.mu button.T{background:color-mix(in srgb,#3f7cc0 16%,var(--panel));border-color:color-mix(in srgb,#3f7cc0 38%,var(--line))}
.mu button.Z{background:color-mix(in srgb,#9a46b8 16%,var(--panel));border-color:color-mix(in srgb,#9a46b8 38%,var(--line))}
.mu button:hover{opacity:.78}
#lib.welcome{grid-template-columns:1fr}#lib.welcome aside{display:none}
@media (max-width:900px){#lib{grid-template-columns:1fr;grid-auto-rows:auto;overflow-y:auto}aside{border-right:0;border-bottom:1px solid var(--line);max-height:60vh}}

<header>
 <b>scry</b>

 <div id="tree" hidden></div>
</header>

<main id="lib">
 <aside>
  <h4>Search</h4>

/* ------------------------------------------------------------------ database */
let sqlite3, db = null, loadedVersion = -1, loadedAt = 0;
const rows = (sql, bind = []) => db.exec({ sql, bind, rowMode: 'object', returnValue: 'resultRows' });
const run = (sql, bind = []) => db.exec({ sql, bind });

function dbFromBytes(bytes) {
  const next = new sqlite3.oo1.DB(':memory:');
  const p = sqlite3.wasm.allocFromTypedArray(bytes);
  const rc = sqlite3.capi.sqlite3_deserialize(next.pointer, 'main', p, bytes.length, bytes.length,
    sqlite3.capi.SQLITE_DESERIALIZE_FREEONCLOSE | sqlite3.capi.SQLITE_DESERIALIZE_RESIZEABLE);
  if (rc) throw new Error('sqlite3_deserialize failed: ' + rc);
  return next;
}
async function loadDb() {
  const res = await fetch('/db', { cache: 'no-store' });
  if (!res.ok) throw new Error('Could not load the database: ' + res.status);
  const next = dbFromBytes(new Uint8Array(await res.arrayBuffer()));
  const old = db;
  db = next;
  if (old) old.close();
  setupDb();
  loadedAt = Date.now();
}

const SYN = [
  [/Nuke/i, 'nuke nuclear ghost'], [/Stimpack/i, 'stim stimpack marine marauder'],
  [/ScannerSweep/i, 'scan scanner sweep detection'], [/MULE/i, 'mule'], [/SpawnLarva/i, 'inject queen larva'],
  [/ChronoBoost/i, 'chrono chronoboost'], [/NeuralParasite/i, 'neural mind control'], [/Fungal/i, 'fungal'],
  [/PsionicStorm/i, 'storm psi templar'], [/ForceField/i, 'ff sentry'], [/Graviton/i, 'graviton phoenix lift'],
  [/Siege/i, 'siege tank'], [/Cloak/i, 'cloak ghost'], [/Burrow/i, 'burrow'], [/EMP/i, 'emp'],
  [/Transfusion/i, 'transfuse queen heal'], [/12-pool/, 'twelve pool'], [/cannon-rush/, 'cannon rush forge'],
  [/reaper-expand/, 'reaper expand'], [/maxed-out/, 'max 200 supply'], [/base-trade/, 'base trade'],
  [/leaver/, 'left quit rage'], [/stomp/, 'one sided crush'], [/CreepTumor/, 'creep'],
];
const words = s => s.replace(/([a-z])([A-Z0-9])/g, '$1 $2').replace(/[-_:]/g, ' ');

function setupDb() {
  run(`create temp table notes_t(rid int primary key, id text, text text);
       create temp table mine_tags(rid int, tag text);
       create temp table sel(rid int primary key);
       create temp view all_tags as select rid,pid,family,tag,label from tags
         union all select rid,null,'mine','mine:'||tag,tag from mine_tags;`);
  run(`create virtual table temp.fts_tags using fts5(label, syn, tag unindexed, family unindexed, tokenize='trigram')`);
  run(`create virtual table temp.fts_text using fts5(text, rid unindexed, kind unindexed, tokenize='trigram')`);
  run(`insert into fts_text select text, rid, 'chat' from chat`);
  syncNotes();
}
function rebuildTagIndex() {
  run('delete from fts_tags');
  const tags = rows('select distinct tag, family, label from all_tags');
  db.transaction(() => {
    for (const t of tags) {
      const syn = [t.family, words(t.tag), ...SYN.filter(([re]) => re.test(t.tag)).map(x => x[1])].join(' ');
      run('insert into fts_tags(label, syn, tag, family) values(?,?,?,?)', [t.label, syn, t.tag, t.family]);
    }
  });
}

const NOTES_KEY = 'scry.notes.v1';
let notes = {};
function loadNotes() { try { notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}') || {}; } catch { notes = {}; } }
function saveNotes() {
  try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); } catch (e) { toast('Could not save notes: ' + e.message, true); }
  syncNotes();
}
function noteFor(id, fp) {
  if (!notes[id]) notes[id] = { fp: fp || '', text: '', tags: [], marks: [] };
  return notes[id];
}
function syncNotes() {
  run('delete from notes_t; delete from mine_tags; delete from fts_text where kind=\'note\'');
  const byId = new Map(), byFp = new Map();
  for (const r of rows('select rid, id, fingerprint from replays')) { byId.set(r.id, r); if (r.fingerprint) byFp.set(r.fingerprint, r); }
  db.transaction(() => {
    for (const [id, n] of Object.entries(notes)) {
      const r = byId.get(id) || byFp.get(n.fp);
      if (!r) continue;
      const text = [n.text, ...(n.marks || []).map(m => m.text)].filter(Boolean).join('\n');
      run('insert or replace into notes_t values(?,?,?)', [r.rid, id, text]);
      for (const t of n.tags || []) run('insert into mine_tags values(?,?)', [r.rid, t]);
      if (text) run('insert into fts_text(text, rid, kind) values(?,?,\'note\')', [text, r.rid]);
    }
  });
  rebuildTagIndex();
}

/* ------------------------------------------------------------------- filters */
const S = {
  folder: '', desc: true, shown: 60,
  tags: [], players: new Map(), scope: true, texts: [], conds: [], ranges: {},
  mu: { a: [], b: [] },  // matchup: one list per side, one entry (null, 'P', 'T' or 'Z') per player slot
};
const THING_LABEL = {
  natural: 'Natural expansion started', third_base: 'Third base started', first_gas: 'First gas',
  first_production: 'First production building', first_tech: 'First tech building',
  first_army: 'First army unit', max_supply: 'Reached 200 supply',
};
const RANGE_KEYS = [['natural', 'Natural expansion'], ['third_base', 'Third base'], ['first_gas', 'First gas'],
  ['first_army', 'First army unit'], ['duration', 'Game length']];

function anyFilter() {
  return S.tags.length || S.players.size || S.texts.length || S.conds.length || Object.keys(S.ranges).length || muActive();
}
/* Matchup: each side lists the races it needs, one slot per player. One side set means "some team has these".
   Both sides set means "one team has the left races and the other team has the right races". */
const MU_NAME = { P: 'Protoss', T: 'Terran', Z: 'Zerg' };
const muNeeds = side => { const c = { P: 0, T: 0, Z: 0 }; for (const r of side) if (r) c[r]++; return c; };
const muHas = c => c.P + c.T + c.Z > 0;
const muActive = () => S.mu.a.some(Boolean) || S.mu.b.some(Boolean);
function muTeamPred(c, alias, p) {
  return ['P', 'T', 'Z'].filter(k => c[k]).map(k => {
    p.push(MU_NAME[k], c[k]);
    return `(select count(*) from players px where px.rid=${alias}.rid and px.team=${alias}.team and px.race=?) >= ?`;
  }).join(' and ');
}
function muLabel() {
  const a = S.mu.a.filter(Boolean).join(''), b = S.mu.b.filter(Boolean).join('');
  return a && b ? a + ' vs ' + b : 'a team with ' + (a || b);
}
function teamSize() {
  const r = rows('select max(c) n from (select count(*) c from players group by rid, team)')[0];
  return Math.max(1, (r && r.n) || 2);
}
function renderMatchup() {
  const n = teamSize(), box = $('#matchup');
  for (const k of ['a', 'b']) S.mu[k] = Array.from({ length: n }, (_, i) => S.mu[k][i] || null);
  box.replaceChildren();
  const side = k => h('div', { class: 'side' }, ...S.mu[k].map((cur, i) => h('div', { class: 'row3' },
    ...Object.entries(MU_NAME).map(([L, name]) => {
      const b = h('button', { class: L + (cur === L ? ' on' : ''), textContent: L, title: 'A ' + name + ' player on this side',
        on: { click: () => { S.mu[k][i] = cur === L ? null : L; refresh(); } } });
      b.dataset.side = k; b.dataset.row = i; b.dataset.race = L;
      return b;
    }))));
  box.append(side('a'), h('span', { class: 'vs' }, 'vs'), side('b'));
}
function playerScope(alias) {
  return `${alias}.pid in (select q.pid from players q where q.rid=${alias}.rid and q.toon in (${ph(S.players.size)}))`;
}
function condSql(c, p) {
  const tbl = c.kind === 'timing' ? 'timings' : 'build_steps';
  const parts = [c.kind === 'timing' ? 'x.key=?' : 'x.name=?'];
  p.push(c.name);
  if (c.kind === 'step' && c.nth) { parts.push('x.nth=?'); p.push(c.nth); }
  if (c.op === 'before') { parts.push('x.t < ?'); p.push(c.a); }
  else if (c.op === 'after') { parts.push('x.t >= ?'); p.push(c.a); }
  else if (c.op === 'between') { parts.push('x.t between ? and ?'); p.push(c.a, Math.max(c.a, c.b)); }
  else if (c.op === 'sup<=') { parts.push('x.supply <= ?'); p.push(c.a); }
  else if (c.op === 'sup>=') { parts.push('x.supply >= ?'); p.push(c.a); }
  return [tbl, parts.join(' and ')];
}
function whereSql() {
  const w = [], p = [];
  if (!anyFilter()) { /* show broken replays too, so the user sees them */ } else w.push('r.error is null');
  if (S.folder) { w.push("r.path like ? escape '\\'"); p.push(likeEsc(S.folder) + '/%'); }
  const scoped = S.scope && S.players.size;
  for (const f of S.tags) {
    let sql = 'exists (select 1 from all_tags t where t.rid=r.rid and t.tag=?';
    p.push(f.tag);
    if (scoped) { sql += ` and (t.pid is null or ${playerScope('t')})`; p.push(...S.players.keys()); }
    sql += ')';
    w.push(sql);
  }
  if (S.players.size) { w.push(`exists (select 1 from players q where q.rid=r.rid and q.toon in (${ph(S.players.size)}))`); p.push(...S.players.keys()); }
  if (muActive()) {
    const A = muNeeds(S.mu.a), B = muNeeds(S.mu.b);
    if (muHas(A) && muHas(B)) {
      const pa = muTeamPred(A, 'a', p), pb = muTeamPred(B, 'b', p);
      w.push(`exists (select 1 from players a join players b on b.rid=a.rid and b.team<>a.team where a.rid=r.rid and ${pa} and ${pb})`);
    } else {
      w.push(`exists (select 1 from players a where a.rid=r.rid and ${muTeamPred(muHas(A) ? A : B, 'a', p)})`);
    }
  }
  for (const t of S.texts) { w.push('r.rid in (select rid from fts_text where fts_text match ?)'); p.push(ftsq(t)); }
  const same = [];
  for (const c of S.conds) {
    if (c.a === null || c.a === undefined || (c.op === 'between' && (c.b === null || c.b === undefined))) continue;
    if (c.scope === 'same') { same.push(c); continue; }
    const [tbl, pred] = condSql(c, p);
    let sql = `exists (select 1 from ${tbl} x where x.rid=r.rid and ${pred}`;
    if (c.scope === 'selected' && S.players.size) { sql += ` and ${playerScope('x')}`; p.push(...S.players.keys()); }
    w.push(sql + ')');
  }
  if (same.length) {
    const inner = same.map(c => {
      const [tbl, pred] = condSql(c, p);
      return `exists (select 1 from ${tbl} x where x.rid=q.rid and x.pid=q.pid and ${pred})`;
    });
    w.push(`exists (select 1 from players q where q.rid=r.rid and ${inner.join(' and ')})`);
  }
  for (const [key, [lo, hi]] of Object.entries(S.ranges)) {
    if (key === 'duration') { w.push('r.duration_s between ? and ?'); p.push(lo, hi); }
    else { w.push('exists (select 1 from timings x where x.rid=r.rid and x.key=? and x.t between ? and ?)'); p.push(key, lo, hi); }
  }
  return [w.length ? 'where ' + w.join(' and ') : '', p];
}

let refreshTimer = 0;
function refreshSoon() { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 120); }

function refresh() {
  if (!db) return;
  S.shown = 60;
  const [where, params] = whereSql();
  run('delete from sel');
  try { run(`insert into sel select r.rid from replays r ${where}`, params); }
  catch (e) { toast('Filter error: ' + e.message, true); console.error(e); return; }
  renderActive(); renderPlayers(); renderMatchup(); renderFacets(); renderList(); renderConds();
  if (!$('#hists').childElementCount) renderHists();
}

/* ---- active chips */
function renderActive() {
  const box = $('#active'); box.replaceChildren();
  const x = (label, cls, fn, title) => box.append(h('span', { class: 'chip ' + cls, title: title || '', on: { click: fn } }, label, h('small', {}, '✕')));
  S.tags.forEach((f, i) => x(f.tag, 'on', () => { S.tags.splice(i, 1); refresh(); }, 'Remove'));

  S.texts.forEach((t, i) => x('text: ' + t, 'on', () => { S.texts.splice(i, 1); refresh(); }, 'Remove'));
  if (muActive()) x('matchup: ' + muLabel(), 'on', () => { S.mu = { a: [], b: [] }; refresh(); }, 'Remove');
  for (const [k, [lo, hi]] of Object.entries(S.ranges)) {
    x((k === 'duration' ? 'length' : k) + ' ' + fmt(lo) + '–' + fmt(hi), 'on', () => { delete S.ranges[k]; $('#hists').replaceChildren(); refresh(); }, 'Remove');
  }

function renderPlayers() {
  const box = $('#players'); box.replaceChildren();

  const list = rows(`select toon, max(name) name, count(distinct rid) c from players

/* ---- facets */
const FAMS = [['build', 'Builds', ['build']], ['unit', 'Units', ['unit']], ['upgrade', 'Upgrades', ['upgrade']],
  ['skill', 'Skills', ['skill']], ['highlights', 'Game highlights', ['shape', 'spectacle']],
  ['econ', 'Economy', ['econ']], ['social', 'Social', ['social']], ['mine', 'Mine', ['mine']]];
const openFams = new Set();   // every category starts collapsed
const famAll = new Set();
function tagState(tag) { return S.tags.find(f => f.tag === tag); }
function renderFacets() {
  const box = $('#facets'); box.replaceChildren();
  const counts = rows(`select family, tag, label, count(distinct rid) c from all_tags
    where rid in (select rid from sel) group by family, tag, label order by c desc, label`);
  const by = {};
  for (const r of counts) (by[r.family] ||= []).push(r);
  const chipFor = (r, extra) => {
    const st = tagState(r.tag);
    return h('span', { class: 'chip fc' + (st ? ' on' : '') + (extra || ''), title: describe(r.tag, r.label), on: { click: () => toggleInclude(r.tag) } },
      r.label, h('small', {}, String(r.c)));
  };
  const maps = $('#maps'); maps.replaceChildren();   // maps sit under the matchup, in a steady (alphabetical) order
  for (const r of (by.map || []).slice().sort((x, y) => x.label.localeCompare(y.label))) maps.append(chipFor(r));
  if (!maps.childElementCount) maps.append(h('span', { class: 'empty', style: 'padding:0;font-size:12.5px' }, 'no maps'));
  for (const [fam, title, srcs] of FAMS) {
    const list = srcs.flatMap(f => by[f] || []).sort((x, y) => (fam === 'unit' ? x.c - y.c : y.c - x.c) || x.label.localeCompare(y.label));   // units: fewest games first
    const d = h('details', { open: openFams.has(fam) });
    d.addEventListener('toggle', () => { d.open ? openFams.add(fam) : openFams.delete(fam); });
    d.append(h('summary', {}, title + ' ', h('small', {}, '(' + list.length + ')')));
    const chips = h('div', { class: 'chips' });
    const limit = famAll.has(fam) ? 1e9 : 14;
    for (const r of list.slice(0, limit)) {
      chips.append(chipFor(r, fam === 'mine' ? ' mine' : ''));
    }
    if (list.length > limit) chips.append(h('span', { class: 'chip', on: { click: () => { famAll.add(fam); renderFacets(); } } }, '+' + (list.length - limit) + ' more'));
    d.append(chips);
    if (list.length || fam !== 'mine') box.append(d);
  }
}

/* ---- search box */
let suggItems = [], suggSel = -1;
function suggest() {
  const q = $('#q').value.trim(), box = $('#sugg');
  suggItems = [];
  if (q) {
    try {
      const r = q.length >= 3
        ? rows('select tag, label, family from fts_tags where fts_tags match ? order by rank limit 12', [ftsq(q)])
        : rows("select tag, label, family from fts_tags where label like ? escape '\\' or syn like ? escape '\\' limit 12", ['%' + likeEsc(q) + '%', '%' + likeEsc(q) + '%']);
      const cnt = new Map(rows('select tag, count(distinct rid) c from all_tags where rid in (select rid from sel) group by tag').map(x => [x.tag, x.c]));
      suggItems = r.map(x => ({ kind: 'tag', tag: x.tag, label: x.label, family: x.family, c: cnt.get(x.tag) || 0 }));
    } catch (e) { console.error(e); }
    if (q.length >= 3) suggItems.push({ kind: 'text', text: q });
  }
  suggSel = -1;
  box.replaceChildren(...suggItems.map((it, i) => h('button', { class: i === suggSel ? 'sel' : '', on: { mousedown: e => { e.preventDefault(); pick(it); } } },
    it.kind === 'tag' ? h('span', {}, it.label + ' ', h('small', { style: 'color:var(--mut)' }, it.family)) : h('span', {}, 'Search chat and notes for "' + it.text + '"'),
    it.kind === 'tag' ? h('small', { style: 'color:var(--mut)' }, it.c + ' game(s)') : null)));
  box.hidden = !suggItems.length;
}
function pick(it) {
  if (it.kind === 'tag') { if (!tagState(it.tag)) S.tags.push({ tag: it.tag }); }
  else if (!S.texts.includes(it.text)) S.texts.push(it.text);
  $('#q').value = ''; $('#sugg').hidden = true; refresh();
}
$('#q').addEventListener('input', suggest);
$('#q').addEventListener('blur', () => setTimeout(() => $('#sugg').hidden = true, 100));
$('#q').addEventListener('keydown', e => {
  const btns = [...$('#sugg').children];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    suggSel = (suggSel + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % Math.max(btns.length, 1);
    btns.forEach((b, i) => b.classList.toggle('sel', i === suggSel));
  } else if (e.key === 'Enter') {
    const it = suggItems[suggSel >= 0 ? suggSel : 0];
    if (it) pick(it);
  } else if (e.key === 'Escape') $('#sugg').hidden = true;
});

/* ---- build timing conditions */
let thingOptions = null;
function things() {
  if (!thingOptions) {
    const steps = rows('select kind, name, count(*) c from build_steps group by kind, name order by kind, name');
    thingOptions = { timing: Object.keys(THING_LABEL), struct: [], unit: [], research: [], morph: [] };
    for (const s of steps) thingOptions[s.kind].push(s.name);
  }
  return thingOptions;
}
$('#addcond').onclick = () => {
  const t = things();
  S.conds.push({ scope: 'any', kind: 'timing', name: t.timing[0], nth: 1, op: 'before', a: null, b: null, ta: '', tb: '' });
  renderConds();
};
function sel(options, value, onchange, title) {
  const s = h('select', { title: title || '', on: { change: () => onchange(s.value) } });
  for (const o of options) {
    if (o.group) { const g = h('optgroup', { label: o.group }); o.items.forEach(([v, l]) => g.append(h('option', { value: v, selected: v === value }, l))); s.append(g); }
    else s.append(h('option', { value: o[0], selected: o[0] === value }, o[1]));
  }
  return s;
}
function renderConds() {
  const box = $('#conds');
  if (box.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return; // do not rebuild while typing
  box.replaceChildren();
  const t = things();
  S.conds.forEach((c, i) => {
    const thingOpts = [
      { group: 'Timings', items: t.timing.map(k => ['timing:' + k, THING_LABEL[k]]) },
      { group: 'Structures', items: t.struct.map(n => ['step:' + n, n]) },
      { group: 'Units (first one)', items: t.unit.map(n => ['step:' + n, n]) },
      { group: 'Research and upgrades', items: t.research.concat(t.morph).map(n => ['step:' + n, n]) },
    ];
    const ops = [['before', 'before'], ['after', 'at or after'], ['between', 'between']];
    if (c.kind === 'step') ops.push(['sup<=', 'at supply ≤'], ['sup>=', 'at supply ≥']);
    const timeIn = (key, ph) => h('input', { value: c[key + 'x'] ?? '', placeholder: ph, on: { input: e => {
      c[key + 'x'] = e.target.value;
      const v = c.op.startsWith('sup') ? (/^\d+$/.test(e.target.value.trim()) ? +e.target.value : null) : parseTime(e.target.value);
      c[key] = v; refreshSoon();
    } } });

/* ---- histogram sliders */
function renderHists() {
  const box = $('#hists'); box.replaceChildren();
  const scope = S.folder ? "where rid in (select rid from replays where path like ? escape '\\')" : '';
  const sp = S.folder ? [likeEsc(S.folder) + '/%'] : [];
  for (const [key, label] of RANGE_KEYS) {
    const vals = key === 'duration'
      ? rows(`select duration_s v from replays where error is null ${S.folder ? "and path like ? escape '\\'" : ''}`, sp).map(r => r.v)
      : rows(`select t v from timings ${scope ? scope + ' and key=?' : 'where key=?'}`, [...sp, key]).map(r => r.v);
    if (vals.length < 2) continue;
    const lo = Math.floor(Math.min(...vals)), hi = Math.ceil(Math.max(...vals));
    if (hi <= lo) continue;
    const cur = S.ranges[key] || [lo, hi];
    const cv = h('canvas', { width: 300, height: 34 });
    const label_ = h('span', {}, '');
    const fillEl = h('div', { class: 'fill' });
    const a = h('input', { type: 'range', min: lo, max: hi, value: cur[0], step: 1 });
    const b = h('input', { type: 'range', min: lo, max: hi, value: cur[1], step: 1 });
    const draw = () => {
      const x = cv.getContext('2d'), n = 24, bins = Array(n).fill(0);
      for (const v of vals) bins[Math.min(n - 1, Math.floor((v - lo) / (hi - lo) * n))]++;
      const m = Math.max(...bins), a1 = +a.value, b1 = +b.value;
      x.clearRect(0, 0, 300, 34);
      const css = getComputedStyle(document.documentElement);
      bins.forEach((c, i) => {
        const v0 = lo + i / n * (hi - lo);
        x.fillStyle = v0 >= a1 - (hi - lo) / n && v0 <= b1 ? css.getPropertyValue('--acc') : css.getPropertyValue('--line');
        const hh = c / m * 32; x.fillRect(i * 12.5 + 1, 34 - hh, 10.5, hh);
      });
      label_.textContent = fmt(a1) + ' – ' + fmt(b1);
      const fa = (a1 - lo) / (hi - lo), fb = (b1 - lo) / (hi - lo);   // 7px = half the handle width
      fillEl.style.left = `calc(7px + (100% - 14px) * ${fa})`;
      fillEl.style.width = `calc((100% - 14px) * ${fb - fa})`;
    };
    const upd = () => {
      let x = +a.value, y = +b.value;
      if (x > y) { [x, y] = [y, x]; a.value = x; b.value = y; }
      if (x <= lo && y >= hi) delete S.ranges[key]; else S.ranges[key] = [x, y];
      draw(); refreshSoon();
    };
    a.oninput = b.oninput = upd;
    draw();
    box.append(h('div', { class: 'hist' }, h('div', { class: 'hn' }, label), h('div', { class: 'hr' }, label_), cv, h('div', { class: 'rg' }, h('div', { class: 'base' }), fillEl, a, b)));
  }
  if (!box.childElementCount) box.append(h('span', { class: 'empty', style: 'padding:0;font-size:12.5px' }, 'not enough data yet'));
}

function matchedSteps(d) {
  const hit = new Set();
  for (const c of S.conds) {
    if (c.kind !== 'step' || c.a === null || c.a === undefined) continue;
    for (const s of d.steps) {
      if (s.name !== c.name || (c.nth && s.nth !== c.nth)) continue;
      const ok = c.op === 'before' ? s.t < c.a : c.op === 'after' ? s.t >= c.a : c.op === 'between' ? s.t >= c.a && s.t <= Math.max(c.a, c.b)
        : c.op === 'sup<=' ? s.supply <= c.a : s.supply >= c.a;
      if (ok) hit.add(s.pid + ':' + s.idx);

}

function drawTimeline(d, note) {

/* ----------------------------------------------------------------------- minimap
   Everything on it is a record of what the replay says, and the replay does not say everything:
   - A structure is known from its placement to its destruction.
   - A unit is known at its birth, at death, and at the position snapshots the game logs about every 10 s.
     A dashed line joins two known points. It is not the path the unit took.
   - A skill has a place only when it was aimed at a point or a unit. Self-cast skills (siege, stim) have none.
   Buildings and units stay at full strength while they live. When one is destroyed it becomes an X, and the X fades.
   Movement lines and skill diamonds fade with their age too.
   The game logs a unit only when it has moved, about every 10.7 s (T_TICK). So when two known places are one tick apart the
   unit is drawn gliding between them, and when they are further apart it waits and then glides during the last tick.

const MAP_W = 480, K = 1.3, FADE_S = 90, T_TICK = 10.7;   // K scales every symbol with the map size

const EPIC = {
  TacticalNukeStrike: { radius: 8, delay: 14, colour: '#e5472f', kind: 'blast', lands: 'nuke lands' },
  ScannerSweep: { radius: 13, delay: 0, lasts: 12.3, colour: '#3b9fd1', kind: 'area' },
  FungalGrowth: { radius: 2.25, delay: 0, lasts: 3, colour: '#9bd34a', kind: 'area' },
  PsionicStorm: { radius: 1.5, delay: 0, lasts: 2.9, colour: '#b794f0', kind: 'area' },
  EMPRound: { radius: 1.5, delay: 0, lasts: 1, colour: '#4aa3ff', kind: 'area' },
  BlindingCloud: { radius: 2, delay: 0, lasts: 11, colour: '#d6b84a', kind: 'area' },
  ForceField: { radius: 1.7, delay: 0, lasts: 11, colour: '#52c3bd', kind: 'area' },
  TemporalField: { radius: 3.5, delay: 0, lasts: 4, colour: '#7ad0ff', kind: 'area' },
  ParasiticBomb: { radius: 3, delay: 0, lasts: 7, colour: '#8fc23a', kind: 'area' },

const HALLS = new Set(['Nexus', 'CommandCenter', 'Hatchery', 'OrbitalCommand', 'PlanetaryFortress', 'Lair', 'Hive']);

function buildMap(d) {
  const units = new Map(d.munits.map(u => [u.uid, { ...u, pts: [] }]));
  for (const q of d.mpts) { const u = units.get(q.uid); if (u) u.pts.push([q.t, q.x, q.y]); }
  for (const u of units.values()) {
    u.pts.sort((a, b) => a[0] - b[0]);
    u.move = u.t1 == null ? u.pts : u.pts.filter(q => q[0] !== u.t1);   // known places while alive
    u.dead = u.t1 == null ? null : (u.pts.find(q => q[0] === u.t1) || null);   // where it died: [t, x, y]
  }
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  const see = (x, y) => { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; };
  for (const s of d.mstructs) see(s.x, s.y);
  for (const q of d.mpts) see(q.x, q.y);
  for (const c of d.casts) if (c.x != null) see(c.x, c.y);
  if (x0 === Infinity) return null;
  x0 -= 6; y0 -= 6; x1 += 6; y1 += 6;
  const scale = MAP_W / Math.max(x1 - x0, y1 - y0);
  // Moments worth a pop-up label: every base going up or down, and the first building of each type per player.
  const pops = [], seen = new Set();
  for (const s of [...d.mstructs].sort((a, b) => a.t0 - b.t0)) {
    const hall = HALLS.has(s.name), key = s.pid + ':' + s.name;
    if ((hall && s.t0 > 0) || (!hall && !seen.has(key))) pops.push({ t: s.t0, x: s.x, y: s.y, text: s.name, pid: s.pid });
    seen.add(key);
    if (hall && s.t1 != null) pops.push({ t: s.t1, x: s.x, y: s.y, text: s.name, pid: s.pid, dead: true });
  }
  const fightLoss = new Map();
  for (const l of d.losses) fightLoss.set(l.fight_idx, (fightLoss.get(l.fight_idx) || 0) + l.value);
  const fights = d.fights.map(f => ({ ...f, value: fightLoss.get(f.idx) || 0 }));
  return { units: [...units.values()], structs: d.mstructs, pops, fights, x0, y0, scale, w: Math.round((x1 - x0) * scale), h: Math.round((y1 - y0) * scale) };
}

  const dpr = window.devicePixelRatio || 1;
  const cv = h('canvas', { width: Math.round(m.w * dpr), height: Math.round(m.h * dpr), style: `width:${m.w}px;height:${m.h}px`,

  col.append(cv, h('div', { class: 'ctl' }, play, seek), h('div', { class: 'meta2' }, clock, speed),
    h('div', { class: 'subt', style: 'margin:6px 0 0', title: 'Between two position snapshots a unit moves in a straight line. That is an estimate.' }, '■ building   ● unit   ◆ skill   ✕ destroyed   ╌╌ movement   ', h('span', { style: 'color:#b01c22' }, '▓'), ' fight'),
    hud);

  const css = getComputedStyle(document.documentElement);     // a canvas cannot use CSS variables, so read their values here
  const light = css.getPropertyValue('--pl').trim() || '68%', bg = css.getPropertyValue('--bg').trim() || '#1a1e22';
  const colour = new Map(d.players.map(pl => [pl.pid, `hsl(${plHue(pl)}, 62%, ${light})`]));
  const ob = css.getPropertyValue('--ob').trim() || '#6b3fa0';
  const sx = x => (x - m.x0) * m.scale, sy = y => m.h - (y - m.y0) * m.scale;   // the game's y axis points up

  // Every icon has an outline so it stays readable when icons pile up. A destroyed icon keeps its own shape
  // (square for a building, dot for a unit) and gets an X inside it, so you can tell which one died.
  const ol = '#0d1013';   // darker than the page, so a pale fill gets a crisp dark edge and overlapping icons stay apart
  function xmark(x, y, r, a) {

/* ------------------------------------------------------------- browser backend
   Used when the page has no server behind it (static hosting). Python runs in Web Workers (Pyodide),
   parsed rows go into the in-memory database, and the database is saved in IndexedDB. */
let MODE = 'server', manifest = null, bsrc = null, bscanning = false;

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('scry', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(key) {
  try {
    const d = await idb();
    return await new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  } catch { return undefined; }
}
async function idbSet(key, value) {
  try {
    const d = await idb();
    await new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(value, key); t.oncomplete = res; t.onerror = () => rej(t.error); });
  } catch (e) { console.warn('IndexedDB write failed', e); }
}

async function startBrowser() {
  $('#choose').hidden = false;
  try { manifest = await (await fetch('./manifest.json')).json(); }
  catch { toast('This site is incomplete: manifest.json is missing.', true); return; }
  const saved = await idbGet('db');
  let next = null;
  if (saved && saved.parser_version === manifest.parser_version) {
    try { next = dbFromBytes(saved.bytes); } catch (e) { console.warn('saved database unusable', e); }
  }
  if (!next) {
    next = new sqlite3.oo1.DB(':memory:');
    next.exec(manifest.schema);
    next.exec({ sql: "insert into meta values('parser_version', ?)", bind: [String(manifest.parser_version)] });
  }
  db = next; setupDb();
  const h0 = await idbGet('handle');
  if (h0) { bsrc = { name: h0.name, handle: h0 }; S.rootAbs = h0.name; $('#dir').value = h0.name; }
  refresh();
}

const REPLAY_RE = /\.sc2replay$/i;
async function listFiles() {
  const out = [];
  if (bsrc.handle) {
    if (bsrc.handle.requestPermission && await bsrc.handle.requestPermission({ mode: 'read' }) !== 'granted') {
      throw new Error('Permission to read the folder was not granted');
    }
    const walk = async (dir, prefix) => {
      for await (const [name, entry] of dir.entries()) {
        if (name.startsWith('.')) continue;
        if (entry.kind === 'directory') await walk(entry, prefix + name + '/');
        else if (REPLAY_RE.test(name)) out.push({ path: prefix + name, file: await entry.getFile() });
      }
    };
    await walk(bsrc.handle, '');
  } else {
    for (const f of bsrc.files) {
      const parts = (f.webkitRelativePath || f.name).split('/').slice(1);
      if (!parts.length) parts.push(f.name);
      if (REPLAY_RE.test(f.name) && !parts.some(x => x.startsWith('.'))) out.push({ path: parts.join('/'), file: f });
    }
  }
  return out.sort((a, b) => (a.path < b.path ? -1 : 1));
}

async function sha256(buf) {
  if (!crypto.subtle) throw new Error('This page needs a secure context (https or localhost)');
  const d = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function deleteReplay(col, val) {
  const r = rows(`select rid from replays where ${col}=?`, [val])[0];
  if (!r) return;
  run('delete from tag_spans where tid in (select tid from tags where rid=?)', [r.rid]);
  for (const t of [...manifest.rec_tables.map(x => x[0]), 'tags']) run(`delete from ${t} where rid=?`, [r.rid]);
  run('delete from replays where rid=?', [r.rid]);
}

function bulk(sql, list) {
  const st = db.prepare(sql);
  try { for (const row of list) st.bind(row).stepReset(); } finally { st.finalize(); }
}

/* Same layout as store() in scry.py. Both read it from REC_TABLES, so they cannot drift apart. */
function storeRec(sha, rel, size, mtimeMs, rec, error) {
  deleteReplay('id', sha);
  deleteReplay('path', rel);
  const mt = mtimeMs / 1000;
  if (!rec) {
    run('insert into replays(id,path,size,mtime,played_at,error) values(?,?,?,?,?,?)', [sha, rel, size, mt, new Date(mtimeMs).toISOString(), error]);
    return;
  }
  const R = rec.replay, f = manifest.replay_fields;
  run(`insert into replays(id,fingerprint,path,size,mtime,${f.join(',')}) values(?,?,?,?,?${',?'.repeat(f.length)})`,
    [sha, R.fingerprint, rel, size, mt, ...f.map(k => R[k])]);
  const rid = db.selectValue('select last_insert_rowid()');
  for (const [table, key, width] of manifest.rec_tables) {
    bulk(`insert into ${table} values(?${',?'.repeat(width)})`, rec[key].map(r => [rid, ...r]));
  }
  let tid = db.selectValue('select coalesce(max(tid),0) from tags');
  const tidOf = new Map(), tagRows = [];
  for (const [pid, family, tag, kind, label, evidence] of rec.tags) {
    tid++; tidOf.set(pid + '|' + tag, tid); tagRows.push([tid, rid, pid, family, tag, kind, label, evidence]);
  }
  bulk('insert into tags values(?,?,?,?,?,?,?,?)', tagRows);
  bulk('insert into tag_spans values(?,?,?)', rec.spans.map(([pid, tag, t0, t1]) => [tidOf.get(pid + '|' + tag), t0, t1]));
}

function spawnWorker() {
  return new Promise((res, rej) => {
    const w = new Worker('./worker.mjs', { type: 'module' });
    w.onerror = e => rej(new Error('The replay reader failed to start: ' + (e.message || 'see the console')));
    w.onmessage = e => {
      if (e.data.type === 'ready') res(w);
      else if (e.data.type === 'fatal') rej(new Error(e.data.error));
    };
  });
}
const parseOn = (w, bytes) => new Promise((res, rej) => {
  w.onerror = e => rej(new Error(e.message || 'worker error'));
  w.onmessage = e => res(e.data);
  w.postMessage({ bytes }, [bytes]);
});

async function scanBrowser() {
  if (bscanning) return;
  bscanning = true;
  const prog = $('#prog'), bar = $('#bar');
  // frac: undefined = bar without a value (busy), a number = progress, null = no bar
  const say = (t, frac) => {
    prog.textContent = t;
    bar.hidden = frac === null || t === '';

  };

    say('Loading…');
    const files = await listFiles();
    const known = rows('select rid, id, path, size, mtime from replays');
    const byPath = new Map(known.map(k => [k.path, k])), byId = new Map(known.map(k => [k.id, k]));

    for (const c of changed) c.sha = await sha256(await c.file.arrayBuffer());

    const vanished = new Map(known.filter(k => !onDisk.has(k.path)).map(k => [k.id, k]));
    const todo = [], queued = new Map();
    run('begin');
    for (const c of changed) {
      const moved = vanished.get(c.sha);
      if (moved) {  // same bytes under a new path: keep the parsed data
        run('update replays set path=?, size=?, mtime=? where rid=?', [c.path, c.file.size, c.file.lastModified / 1000, moved.rid]);
        vanished.delete(c.sha);
        continue;
      }
      const dup = byId.get(c.sha);
      if (dup && dup.path !== c.path && onDisk.has(dup.path)) { errors.push('duplicate of ' + dup.path + ': ' + c.path); continue; }
      if (queued.has(c.sha)) { errors.push('duplicate of ' + queued.get(c.sha) + ': ' + c.path); continue; }
      queued.set(c.sha, c.path);
      todo.push(c);
    }
    for (const v of vanished.values()) deleteReplay('id', v.id);
    run('commit');

    const total = todo.length;
    let next = 0, done = 0, lastUi = 0;
    if (total) {
      const n = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 4) - 1, total));
      say('Loading…');
      workers = await Promise.all(Array.from({ length: n }, spawnWorker));
      const loop = async w => {
        while (next < todo.length) {
          const job = todo[next++];
          const msg = await parseOn(w, await job.file.arrayBuffer());
          const out = JSON.parse(msg.json);
          db.transaction(() => storeRec(job.sha, job.path, job.file.size, job.file.lastModified, out.rec || null, out.error || null));
          if (out.error) errors.push(job.path + ': ' + out.error);
          done++;
          say('Loading ' + done + ' / ' + total, done / total);
          if (Date.now() - lastUi > 1500) { lastUi = Date.now(); refresh(); }
        }
      };
      await Promise.all(workers.map(loop));
    }
    run("delete from fts_text where kind='chat'");
    run("insert into fts_text select text, rid, 'chat' from chat");
    thingOptions = null; $('#hists').replaceChildren();
    syncNotes();
    refresh();
    await idbSet('db', { parser_version: manifest.parser_version, bytes: sqlite3.capi.sqlite3_js_db_export(db.pointer) });
    say(total ? 'Loaded ' + total + ' new replay(s)' : 'Up to date', null);
    if (errors.length) console.warn(errors.join('\n'));
  } catch (e) {
    try { run('rollback'); } catch { /* no open transaction */ }
    toast(e.message, true); console.error(e);
    say('', null);
  } finally {
    for (const w of workers) w.terminate();  // frees the memory each Python runtime holds
    bscanning = false;
  }
}

function treeFromDb() {
  const root = { name: (bsrc && bsrc.name) || 'replays', rel: '', n: 0, total: 0, kids: new Map() };
  for (const { path } of rows('select path from replays')) {
    const parts = path.split('/');
    let node = root; node.total++;
    parts.slice(0, -1).forEach((part, i) => {
      if (!node.kids.has(part)) node.kids.set(part, { name: part, rel: parts.slice(0, i + 1).join('/'), n: 0, total: 0, kids: new Map() });
      node = node.kids.get(part); node.total++;
    });
    node.n++;
  }
  const fin = n => ({ ...n, kids: [...n.kids.values()].sort((a, b) => a.name.localeCompare(b.name)).map(fin) });
  const t = fin(root); t.abs = root.name;
  return t;
}

/* ------------------------------------------------------------------ startup */
function toast(m, warn) { const s = $('#status'); s.textContent = m; s.classList.toggle('warn', !!warn); }
async function poll() {
  let st;
  try { st = await (await fetch('/api/status', { cache: 'no-store' })).json(); } catch { return; }
  S.rootAbs = st.root;
  if (!$('#dir').value) $('#dir').value = st.root;
  if (st.scanning) {
    $('#status').classList.remove('warn');
    $('#status').textContent = 'Scanning ' + st.done + '/' + st.total + '…';
    if (st.version !== loadedVersion && Date.now() - loadedAt > 4000) await reload(st.version);
  } else if (st.version !== loadedVersion) {
    await reload(st.version);
    if (st.errors.length) console.warn(st.errors.join('\n'));
  }
}
async function reload(version) {
  try {
    await loadDb(); loadedVersion = version; thingOptions = null;
    $('#hists').replaceChildren();
    if ($('#game').hidden) refresh();  // an open game keeps showing the data it already loaded
  } catch (e) { toast(e.message, true); console.error(e); }
}

try {
  loadNotes();
  // A server answers /api/status. A static host does not, and the browser backend takes over.
  const st = await fetch('/api/status', { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).catch(() => null);
  sqlite3 = await (await import('./vendor/index.mjs')).default();
  if (st) { MODE = 'server'; await poll(); setInterval(poll, 1500); }
  else { MODE = 'browser'; await startBrowser(); }
} catch (e) {
  toast('Startup failed: ' + e.message, true); console.error(e);
}
